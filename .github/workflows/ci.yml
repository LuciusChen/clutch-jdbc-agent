name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/postgres?user=postgres&password=test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test and package
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Protocol smoke test
        run: |
          response="$(printf '%s\n' '{"id":1,"op":"ping","params":{}}' | java -jar target/clutch-jdbc-agent-*.jar 2>/dev/null | tail -n 1)"
          test "$response" = '{"id":1,"ok":true,"result":{"pong":true}}'
